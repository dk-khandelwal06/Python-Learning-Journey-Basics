<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Side Images -->
    </div>
    <div class="side-img left-img">
        <img src="a86bedaf-3eec-4fe5-862f-e8986b8fa6fc.png" alt="User Photo Left">
    </div>
    <div class="side-img right-img">
        <img src="a86bedaf-3eec-4fe5-862f-e8986b8fa6fc.png" alt="User Photo Right">
    </div>

    <div class="container">
        <h1>Temperature Converter</h1>
        <div class="input-group">
            <label for="username">Hey Mate, What's Your Name?</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label for="temperature">Enter Temperature:</label>
            <input type="number" id="temperature" placeholder="Enter value">
        </div>
        <div class="input-group">
            <label for="from">Convert From:</label>
            <select id="from">
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
                <option value="K">Kelvin</option>
            </select>
        </div>
        <div class="input-group">
            <label for="to">Convert To:</label>
            <select id="to">
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
                <option value="K">Kelvin</option>
            </select>
        </div>
        <button onclick="convertTemperature()">Convert</button>
        <div class="result" id="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
